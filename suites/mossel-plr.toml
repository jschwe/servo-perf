# The mossel campaign on a HarmonyOS phone, servoshell against the platform
# browser.
#
# Run with:  servoperf suite mossel-plr --ohos
#
# Unlike `mossel`, the two legs are two different *apps*, not one wrapper with
# two engines: ArkWeb runs in the test wrapper and Servo in servoshell. Each leg
# names its own bundle and there is no engine switch between them.
#
# The ArkWeb side is deliberately NOT the stock browser. Measured on a PLR-AL00,
# `com.huawei.hmos.browser` puts a modal "Allow Browser to send you
# notifications?" over m.huaweimossel.com on every launch — it swallows every
# injected swipe, so the scroll workloads measured an inert page — and each
# `aa start -U` opens another tab, whose renderer keeps running and, because
# attribution is by library rather than by process, lands in the totals.
#
# What still differs between the legs: startup path, and the app shell around
# the engine. Both run `--chrome=none`, so the viewport matches.

name = "mossel-plr"

[device]
# PLR-AL00's soc_thermal reads a flat 30000 m°C under any load.
thermal_zone = "board_thermal"

[defaults]
iterations = 15
capture_seconds = 20
instructions_period = 1000000
trace_tags = "app,nweb"
with_instructions = true
# Keep only the markers servoperf reads (FirstContentfulPaint, RanLayout). The
# instrumentation sits inside the counted frames: under the old
# `info,[{servo_profiling=true}]=trace` filter, Servo's per-function spans added
# ~25% to layout_proper on mossel-index, and upstream #47669's spans on
# ScrollTree::cumulative_node_transform ~46% to display-list building.
tracing_filter = "info,layout::layout_impl=debug"

[[leg]]
id = "arkweb"
engine = "arkweb"
bundle = "org.openharmonyrs.arkwebtest"
# Blink emits its markers regardless of the threshold, so leave the device's
# trace level alone on this leg.
trace_level = ""

[[leg]]
id = "servo"
engine = "servo"
bundle = "org.servo.servo"

[[workload]]
name = "mossel-index"

[[workload]]
name = "mossel-sort"

[[workload]]
name = "mossel-articles"

[[workload]]
name = "mossel-cart"

[[workload]]
name = "mossel-user"

[[workload]]
name = "mossel-index-scroll"
capture_seconds = 48

[[workload]]
name = "mossel-sort-scroll"
capture_seconds = 48

[[workload]]
name = "mossel-articles-scroll"
capture_seconds = 48

[[workload]]
name = "mossel-cart-scroll"
capture_seconds = 48

[[workload]]
name = "mossel-user-scroll"
capture_seconds = 48
