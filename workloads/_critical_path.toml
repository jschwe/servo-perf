# Critical-path phases for Servo startup to FirstContentfulPaint.
# Names aligned with servo's upstream profiling spans as of
# e2f17e0d28c (after PRs #44443 and #44456). Adjust when servo adds
# or renames startup spans.

[[phase]]
name = "create_platform_window"
owner_thread = "main"

[[phase]]
# Runner always spawns servoshell with `--headless`, so the window
# created is HeadlessWindow (not HeadedWindow).
name = "HeadlessWindow::new"
owner_thread = "main"

# Sub-spans inside SoftwareRenderingContext::new (called from HeadlessWindow::new),
# used to localise where the ~133 ms goes during headless startup.
[[phase]]
name = "surfman::Connection::new"
owner_thread = "main"

[[phase]]
name = "surfman::create_software_adapter"
owner_thread = "main"

[[phase]]
name = "SurfmanRenderingContext::new"
owner_thread = "main"

[[phase]]
name = "surfman::create_device"
owner_thread = "main"

[[phase]]
name = "surfman::create_context_descriptor"
owner_thread = "main"

[[phase]]
name = "surfman::create_context"
owner_thread = "main"

[[phase]]
name = "gleam::load_with"
owner_thread = "main"

[[phase]]
name = "glow::from_loader_function"
owner_thread = "main"

[[phase]]
name = "surfman::create_surface"
owner_thread = "main"

[[phase]]
name = "surfman::bind_surface"
owner_thread = "main"

[[phase]]
name = "surfman::make_current"
owner_thread = "main"

[[phase]]
name = "surfman::create_attached_swap_chain"
owner_thread = "main"

# Inner spans inside surfman 0.12.0 (local-patched), to attribute the
# 133 ms cost of HeadlessWindow::new further. The Connection::new chain
# tries Wayland/X11 first, then falls back to the surfaceless-Mesa path.
[[phase]]
name = "wayland::Connection::new"
owner_thread = "main"

[[phase]]
name = "x11::Connection::new"
owner_thread = "main"

[[phase]]
name = "generic::Connection::new"
owner_thread = "main"

[[phase]]
name = "eglGetPlatformDisplay"
owner_thread = "main"

[[phase]]
name = "eglInitialize"
owner_thread = "main"

[[phase]]
name = "generic::create_context"
owner_thread = "main"

[[phase]]
name = "EGLBackedContext::new"
owner_thread = "main"

[[phase]]
name = "EGLBackedContext::make_current"
owner_thread = "main"

[[phase]]
name = "Gl::from_loader_function"
owner_thread = "main"

[[phase]]
name = "generic::create_surface"
owner_thread = "main"

[[phase]]
name = "generic::create_generic_surface"
owner_thread = "main"

[[phase]]
name = "temporarily_make_context_current"
owner_thread = "main"

[[phase]]
name = "EGLBackedSurface::new_generic"
owner_thread = "main"

[[phase]]
name = "Servo::new"
owner_thread = "main"

[[phase]]
name = "script::init"
owner_thread = "main"

[[phase]]
name = "create_toplevel_webview"
owner_thread = "main"

[[phase]]
name = "handle_new_top_level_browsing_context"
owner_thread = "Constellation"

# Upstream typo in servo's `#[servo_tracing::instrument(name = ...)]`
# (components/script/script_thread.rs). Match what is emitted until the
# upstream typo is fixed.
[[phase]]
name = "ScripThread::new"
owner_thread = "Script"

[[phase]]
name = "pre_page_load"
owner_thread = "Script"

[[phase]]
name = "ServoParser::finish"
owner_thread = "Script"

[[phase]]
name = "Window::reflow"
owner_thread = "Script"

[[phase]]
# perform_updates fires on every main-thread turn (~once per 5 ms),
# so the first-occurrence value is uninformative. Sum all turns in
# the [startup, FCP] window to get total main-thread paint/update time.
name = "perform_updates"
owner_thread = "main"
aggregate = true

[[phase]]
# render() runs inside perform_updates when the frame needs to be
# repainted. Aggregating gives total WebRender + GL time pre-FCP.
name = "render"
owner_thread = "main"
aggregate = true

[[phase]]
name = "FirstPaint"
owner_thread = "main"
is_milestone = true

[[phase]]
name = "FirstContentfulPaint"
owner_thread = "main"
is_milestone = true

[[phase]]
name = "LargestContentfulPaint"
owner_thread = "main"
is_milestone = true

# Edges whose observed gap we want to flag when it grows. Order matters.

[[edge]]
from = "create_platform_window"
to = "Servo::new"
expected_gap_ms = 0.5
flag_threshold_ms = 5

[[edge]]
from = "Servo::new"
to = "create_toplevel_webview"
expected_gap_ms = 1
flag_threshold_ms = 10

[[edge]]
from = "handle_new_top_level_browsing_context"
to = "ScripThread::new"
expected_gap_ms = 3
flag_threshold_ms = 15

[[edge]]
from = "pre_page_load"
to = "ServoParser::finish"
expected_gap_ms = 40
flag_threshold_ms = 200

[[edge]]
from = "ServoParser::finish"
to = "Window::reflow"
expected_gap_ms = 1
flag_threshold_ms = 20

[[edge]]
from = "Window::reflow"
to = "FirstPaint"
expected_gap_ms = 40
flag_threshold_ms = 120
