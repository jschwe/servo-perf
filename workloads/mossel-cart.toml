name = "mossel-cart"
# 购物车 cart: renders almost nothing when logged out, so it was intended as a
# low-layout control — but one DAYU200 run recorded 632 layouts against 19 for
# mossel-user, so something here relayouts repeatedly. Investigate before
# treating its numbers as a baseline.
url = "https://m.huaweimossel.com/#/pages/tabbarcart"
iterations = 15
# No viewport / dpr / user-agent: those are servoshell-only args, and this
# workload is meant to run inside the arkweb wrapper app, where the viewport
# comes from the app's window and is identical for both engines.
# `--chrome=none` hides the wrapper app's toolbar so the Web component fills
# the window: the toolbar costs ArkUI layout every frame and shrinks the
# viewport, which changes how much the page has to lay out.
servoshell_args = ["--ignore-certificate-errors", "--chrome=none"]
