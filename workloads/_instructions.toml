# Global per-engine instruction-aggregation registry.
#
# servoperf detects which engine to use from the bundle name (--ohos-bundle).
# The selected engine's `functions` substring list is matched against the
# resolved symbol names in hiperf's stack-mode text report; each match
# contributes its inclusive instruction count to the per-iteration metric
# named after the function.
#
# Matching semantics (same as /tmp/parse_stack_report.py from session work):
#   - case-sensitive substring match
#   - within a single root-to-leaf path in the call tree, each function name
#     is counted at most once (deepest occurrence wins) so transitively
#     re-entered frames (e.g. UpdateLifecycle calling itself via a thunk)
#     don't double-count.
#
# To add a new engine:
#   1. Add a `[[engines]]` entry whose `bundles` list contains every bundle
#      name servoperf might launch with this engine.
#   2. Optionally set `symbol_file` — a host-side path to an unstripped .so
#      that hiperf needs in `--symbol-dir`. Used by
#      `servoperf prepare-arkweb-symbols` to produce the merged file and
#      push it. Engines whose on-device library already has a usable
#      .symtab (e.g. servoshell built with debug symbols) can leave it
#      empty; servoperf will skip the prep step.

[[engines]]
id = "servo"
# Servo builds installed under any of these bundles map to engine = servo.
bundles = [
  "org.servo.servo",
  "org.servo.servo.base",
  "org.servo.servo.patch",
]
# Stage the unstripped libservoshell.so whose BuildID matches the
# installed bundle (e.g. copied from
# `target/aarch64-unknown-linux-ohos/release/libservoshell.so` in the
# servo worktree that produced the .hap). Host-side perf.data parsing
# needs it to resolve sample IPs to function names.
symbol_file = "libservoshell.symbols.so"
# Inclusive instruction counts for these symbols are exported as
# per-iteration metrics named `instructions.<func>`.
functions = [
  # Host-side path uses rustc_demangle, which gives readable trait-impl
  # output: `<layout::…::LayoutThread as layout_api::Layout>::reflow`.
  # The `Layout>::reflow` substring matches that and isn't found in any
  # other reflow-related symbol (handle_reflow has no `>` in its name).
  "Layout>::reflow",
  "Window>::reflow",
  "LayoutThread>::handle_reflow",
  # Vsync paths. `on_vsync_cb` fires per OHOS vsync callback (every frame
  # under the legacy per-frame-resubscribe path; only when an observer
  # asks under the on-demand path). `Paint::perform_updates` covers the
  # main-thread paint/update turn that vsync triggers.
  "on_vsync_cb",
  "Paint::perform_updates",
  # --- d41bb930 investigation: localize the +15% reflow regression ---
  # Reflow sub-phases (all run under handle_reflow):
  "build_display_list",
  "build_stacking_context_tree",
  "handle_animated_image",
  # The rendering-opportunity parent (sibling: update_active_frames):
  "update_the_rendering",
  "update_active_frames",
]
# Servoperf injects these flags (one per line) when the workload uses a
# fixture-side proxy (e.g. wpr-replay). `$PROXY` is replaced with the
# host-side proxy URI (already reachable from device via `hdc rport`).
# Pre-`--ps=` / `--psn=` lines are passed through verbatim; bare lines
# are wrapped in `--psn=…` automatically.
proxy_args = [
  "--pref=network_https_proxy_uri=$PROXY",
  "--pref=network_http_proxy_uri=$PROXY",
  "--ignore-certificate-errors",
]
# One span per completed layout run. `handle_reflow` carries
# `#[servo_tracing::instrument]`, so the span name is the bare function
# name — but only in a hap built with the `tracing` feature; a plain
# release build emits no Servo spans at all and `reflow.count` stays 0.
reflow_spans = ["handle_reflow"]
# `<LayoutThread as Layout>::reflow` is the outer entry point and survives
# LTO; `handle_reflow` and `build_display_list` get inlined into it at
# codegen-units=1 and resolve to 0 (measured on the DAYU200 shim build), so
# they are kept in `functions` as diagnostics but must not be the numerator.
reflow_instructions = "Layout>::reflow"


# --- Comparison groupings -------------------------------------------------
# Each is reported as `instructions.<name>`. A group counts a sample once if
# the chain contains ANY member, so where a group is smaller than the sum of
# its members' own metrics, the difference is the overlap between them.

# Style recalc + box/fragment trees: what Blink accounts to
# `LocalFrameView::UpdateStyleAndLayout`. NOTE `restyle_and_build_trees` is
# inlined at codegen-units=1, so this currently sees only the parallel restyle
# and fragment-tree jobs. Add `#[inline(never)]` to it for a true figure.
[[engines.group]]
name = "layout_proper"
functions = ["restyle_and_build_trees"]

# Stacking-context tree + display list. `handle_reflow` runs these, but Blink
# does the equivalent in its paint lifecycle, so they must be compared against
# `paint_prep` on the other engine rather than folded into layout.
[[engines.group]]
name = "paint_prep"
functions = ["build_stacking_context_tree", "build_display_list"]

# The grouping used elsewhere in the team: the script-side reflow entry point,
# which covers style, layout, paint prep, the a11y tree and scroll nodes.
[[engines.group]]
name = "colleagues_reflow"
functions = ["Window>::reflow"]

[[engines]]
id = "arkweb"
bundles = [
  "org.openharmonyrs.arkwebtest",
  "com.huawei.hmos.browser",
]
# On-device libarkweb_engine.so is stripped to .dynsym + .gnu_debugdata
# (LZMA-compressed minidebug). `servoperf prepare-arkweb-symbols` extracts
# .gnu_debugdata, re-adds proper .symtab / .strtab sections, and pushes the
# result. Path here is host-side; the device-side push target is fixed at
# /data/local/tmp/symbols/libarkweb_engine.so.
symbol_file = "libarkweb_engine.merged.so"
functions = [
  "WebFrameWidgetImpl::UpdateLifecycle",
  "LocalFrameView::UpdateAllLifecyclePhases",
  "LocalFrameView::RunPaintLifecyclePhase",
  "LocalFrameView::UpdateStyleAndLayoutIfNeededRecursive",
  "LocalFrameView::UpdateStyleAndLayout(",
  "Document::UpdateStyleAndLayout(",
  "Document::UpdateStyleAndLayoutTree",
]
# arkweb-test reads these in EntryAbility.ets and applies the proxy via
# webview.ProxyController.applyProxyOverride before loadUrl.
proxy_args = [
  "--proxy-uri=$PROXY",
  "--ignore-certificate-errors",
]
# Blink emits these under the `nweb` hitrace tag. `performLayout` counts
# layouts that actually ran (forced or lifecycle-driven), which is the
# denominator that holds still: measured across 5 cold loads of
# m.huaweimossel.com it varied 2.9% (251-270), while
# `Blink.ForcedStyleAndLayout.UpdateTime` varied 21% (6 892-10 869)
# because most of those calls find style already clean and do no layout.
reflow_spans = ["LocalFrameView::performLayout"]
reflow_instructions = "Document::UpdateStyleAndLayout("


# --- Comparison groupings (see the servo entry for the semantics) ---------

# Style recalc + layout, excluding paint. The like-for-like counterpart of
# Servo's `layout_proper`.
[[engines.group]]
name = "layout_proper"
functions = ["LocalFrameView::UpdateStyleAndLayout("]

# Paint lifecycle: the counterpart of Servo's stacking-context tree and
# display-list building.
[[engines.group]]
name = "paint_prep"
functions = ["LocalFrameView::RunPaintLifecyclePhase", "PrePaintTreeWalk"]

# The grouping used elsewhere in the team. Note these two overlap — lifecycle
# style+layout runs under `UpdateLifecycle` — so this group deliberately comes
# out *below* `instructions.Document::UpdateStyleAndLayout(` plus
# `instructions.WebFrameWidgetImpl::UpdateLifecycle` added by hand. The gap is
# the double-count in that arithmetic. `UpdateLifecycle` is also mostly not
# layout: measured 2026-07, only 18% of its inclusive instructions contained a
# layout frame, the rest being paint and compositing.
[[engines.group]]
name = "colleagues_reflow"
functions = ["Document::UpdateStyleAndLayout(", "WebFrameWidgetImpl::UpdateLifecycle"]

# Servo running as the ArkWeb backend, inside the same wrapper app as the
# entry above. Bundle matching cannot tell the two apart — the engine is
# chosen by a device system parameter, not by which app is launched — so this
# entry is selected explicitly with `--engine servo-arkweb` and claims no
# bundles of its own.
[[engines]]
id = "servo-arkweb"
bundles = []
# Unstripped `libservo_arkweb.so` from the build that produced the copy on the
# device — check `/proc/<pid>/maps` for the library that is actually mapped.
# Stage it under workloads/ with this name.
symbol_file = "libservo_arkweb.symbols.so"
functions = [
  # Patterns are matched against rustc-demangled names, where an inherent
  # method renders as `<Type>::method` — so the `>` is part of the name and
  # `LayoutThread::handle_reflow` matches nothing. Verify a new pattern
  # against the staged .so with `nm -C … | grep` before trusting a zero.
  "Layout>::reflow",
  "Window>::reflow",
  "LayoutThread>::handle_reflow",
  # Paint-prep, which `handle_reflow` runs but Blink accounts to the paint
  # lifecycle rather than to reflow. Subtract these to get the number that
  # compares like-for-like against `LocalFrameView::UpdateStyleAndLayout`.
  # `build_stacking_context_tree` survives as a LayoutThread method;
  # `build_display_list` is inlined and only matches the per-Fragment
  # helpers, so it undercounts the serial part.
  "build_display_list",
  "build_stacking_context_tree",
  # `restyle_and_build_trees` is inlined into handle_reflow at
  # codegen-units=1, leaving only rayon job closures — it therefore measures
  # the *parallel* portions of restyle and fragment-tree building, not the
  # whole subtree. Add `#[inline(never)]` to it in a measurement build if you
  # want the Blink-comparable subtree directly.
  "restyle_and_build_trees",
  "update_the_rendering",
]
reflow_spans = ["handle_reflow"]
# `<LayoutThread as Layout>::reflow` is the outer entry point and survives
# LTO; `handle_reflow` and `build_display_list` get inlined into it at
# codegen-units=1 and resolve to 0 (measured on the DAYU200 shim build), so
# they are kept in `functions` as diagnostics but must not be the numerator.
reflow_instructions = "Layout>::reflow"

# --- Comparison groupings -------------------------------------------------
# Each is reported as `instructions.<name>`. A group counts a sample once if
# the chain contains ANY member, so where a group is smaller than the sum of
# its members' own metrics, the difference is the overlap between them.

# Style recalc + box/fragment trees: what Blink accounts to
# `LocalFrameView::UpdateStyleAndLayout`. NOTE `restyle_and_build_trees` is
# inlined at codegen-units=1, so this currently sees only the parallel restyle
# and fragment-tree jobs. Add `#[inline(never)]` to it for a true figure.
[[engines.group]]
name = "layout_proper"
functions = ["restyle_and_build_trees"]

# Stacking-context tree + display list. `handle_reflow` runs these, but Blink
# does the equivalent in its paint lifecycle, so they must be compared against
# `paint_prep` on the other engine rather than folded into layout.
[[engines.group]]
name = "paint_prep"
functions = ["build_stacking_context_tree", "build_display_list"]

# The grouping used elsewhere in the team: the script-side reflow entry point,
# which covers style, layout, paint prep, the a11y tree and scroll nodes.
[[engines.group]]
name = "colleagues_reflow"
functions = ["Window>::reflow"]
