# Global per-engine instruction-aggregation registry.
#
# servoperf detects which engine to use from the bundle name (--ohos-bundle).
# The selected engine's `functions` substring list is matched against the
# resolved symbol names in hiperf's stack-mode text report; each match
# contributes its inclusive instruction count to the per-iteration metric
# named after the function.
#
# Matching semantics (same as /tmp/parse_stack_report.py from session work):
#   - case-sensitive substring match
#   - within a single root-to-leaf path in the call tree, each function name
#     is counted at most once (deepest occurrence wins) so transitively
#     re-entered frames (e.g. UpdateLifecycle calling itself via a thunk)
#     don't double-count.
#
# To add a new engine:
#   1. Add a `[[engines]]` entry whose `bundles` list contains every bundle
#      name servoperf might launch with this engine.
#   2. Optionally set `symbol_file` — a host-side path to an unstripped .so
#      that hiperf needs in `--symbol-dir`. Used by
#      `servoperf prepare-arkweb-symbols` to produce the merged file and
#      push it. Engines whose on-device library already has a usable
#      .symtab (e.g. servoshell built with debug symbols) can leave it
#      empty; servoperf will skip the prep step.

[[engines]]
id = "servo"
# Servo builds installed under any of these bundles map to engine = servo.
bundles = [
  "org.servo.servo",
  "org.servo.servo.base",
  "org.servo.servo.patch",
]
# Stage the unstripped libservoshell.so whose BuildID matches the
# installed bundle (e.g. copied from
# `target/aarch64-unknown-linux-ohos/release/libservoshell.so` in the
# servo worktree that produced the .hap). Host-side perf.data parsing
# needs it to resolve sample IPs to function names.
symbol_file = "libservoshell.symbols.so"
# Inclusive instruction counts for these symbols are exported as
# per-iteration metrics named `instructions.<func>`.
functions = [
  # Host-side path uses rustc_demangle, which gives readable trait-impl
  # output: `<layout::…::LayoutThread as layout_api::Layout>::reflow`.
  # The `Layout>::reflow` substring matches that and isn't found in any
  # other reflow-related symbol (handle_reflow has no `>` in its name).
  "Layout>::reflow",
  "Window>::reflow",
  "LayoutThread::handle_reflow",
  # Vsync paths. `on_vsync_cb` fires per OHOS vsync callback (every frame
  # under the legacy per-frame-resubscribe path; only when an observer
  # asks under the on-demand path). `Paint::perform_updates` covers the
  # main-thread paint/update turn that vsync triggers.
  "on_vsync_cb",
  "Paint::perform_updates",
  # --- d41bb930 investigation: localize the +15% reflow regression ---
  # Reflow sub-phases (all run under handle_reflow):
  "build_display_list",
  "build_stacking_context_tree",
  "handle_animated_image",
  # The rendering-opportunity parent (sibling: update_active_frames):
  "update_the_rendering",
  "update_active_frames",
]
# Servoperf injects these flags (one per line) when the workload uses a
# fixture-side proxy (e.g. wpr-replay). `$PROXY` is replaced with the
# host-side proxy URI (already reachable from device via `hdc rport`).
# Pre-`--ps=` / `--psn=` lines are passed through verbatim; bare lines
# are wrapped in `--psn=…` automatically.
proxy_args = [
  "--pref=network_https_proxy_uri=$PROXY",
  "--pref=network_http_proxy_uri=$PROXY",
  "--ignore-certificate-errors",
]

[[engines]]
id = "arkweb"
bundles = [
  "org.openharmonyrs.arkwebtest",
  "com.huawei.hmos.browser",
]
# On-device libarkweb_engine.so is stripped to .dynsym + .gnu_debugdata
# (LZMA-compressed minidebug). `servoperf prepare-arkweb-symbols` extracts
# .gnu_debugdata, re-adds proper .symtab / .strtab sections, and pushes the
# result. Path here is host-side; the device-side push target is fixed at
# /data/local/tmp/symbols/libarkweb_engine.so.
symbol_file = "libarkweb_engine.merged.so"
functions = [
  "WebFrameWidgetImpl::UpdateLifecycle",
  "LocalFrameView::UpdateAllLifecyclePhases",
  "LocalFrameView::RunPaintLifecyclePhase",
  "LocalFrameView::UpdateStyleAndLayoutIfNeededRecursive",
  "LocalFrameView::UpdateStyleAndLayout(",
  "Document::UpdateStyleAndLayout(",
  "Document::UpdateStyleAndLayoutTree",
]
# arkweb-test reads these in EntryAbility.ets and applies the proxy via
# webview.ProxyController.applyProxyOverride before loadUrl.
proxy_args = [
  "--proxy-uri=$PROXY",
  "--ignore-certificate-errors",
]
